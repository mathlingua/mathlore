name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: mlg check
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mathlore
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build hermetic test container
        run: docker build -t mathlore-check .

      - name: Run mlg check
        run: docker run --rm mathlore-check
